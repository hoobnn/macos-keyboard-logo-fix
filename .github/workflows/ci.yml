name: CI

# 单元测试与未签名构建校验。推送 main、PR 时运行；release.yml 发版前也调用它。
on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "assets/**"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "assets/**"
      - "LICENSE"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# 同一分支上新的推送取消旧的运行。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 🧪 Unit tests
        run: make test

      - name: 🔨 Build app (ad-hoc signature)
        run: make app

      - name: 🔍 Verify bundle
        run: |
          set -euo pipefail
          APP="dist/Keyboard Logo Fix.app"
          BIN="$APP/Contents/MacOS/Keyboard Logo Fix"
          lipo -archs "$BIN" | grep -q arm64
          lipo -archs "$BIN" | grep -q x86_64
          plutil -lint "$APP/Contents/Info.plist"
          test "$(plutil -extract CFBundleIconFile raw "$APP/Contents/Info.plist")" = "KeyboardLogoFix.icns"
          test -f "$APP/Contents/Resources/KeyboardLogoFix.icns"
          codesign --verify --deep --strict --verbose=2 "$APP"
