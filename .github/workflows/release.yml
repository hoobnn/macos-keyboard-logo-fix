name: Release

# 推送 v* 标签：测试 → 签名、公证、发布 GitHub Release → 同步 Homebrew cask。
# 在分支上手动触发时只做签名公证构建（产物见 workflow run），不发布。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

# 发版不取消：公证做到一半被中断，最难收拾。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    permissions:
      contents: write
    uses: hoobnn/ci-workflows/.github/workflows/macos-release.yml@v1-next
    with:
      app-path: "dist/Keyboard Logo Fix.app"
      build-command: make app
      artifact-basename: Keyboard-Logo-Fix
      make-dmg: true
      dmg-volume-name: Keyboard Logo Fix
    secrets: inherit

  homebrew:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    uses: hoobnn/ci-workflows/.github/workflows/homebrew-cask.yml@v1-next
    with:
      cask: keyboard-logo-fix
      artifact-basename: Keyboard-Logo-Fix
      version: ${{ needs.release.outputs.version }}
    secrets: inherit
